<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="geist-dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTL View Tray</title>
    <link rel="stylesheet" href="style.css">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: transparent !important;
            overflow: hidden;
            font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .tray-container {
            width: 100%;
            height: 100%;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tray-card {
            width: 100%;
            background: var(--bg-card, #121212);
            border: 1px solid var(--border, #242424);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            animation: trayFadeIn 0.15s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes trayFadeIn {
            from {
                opacity: 0;
                transform: translateY(6px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .tray-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 8px 8px 8px;
            border-bottom: 1px solid var(--border, #242424);
            margin-bottom: 4px;
        }

        .tray-brand {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-main, #ededed);
            letter-spacing: -0.2px;
        }

        .tray-brand .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #00dfd8;
            box-shadow: 0 0 8px #00dfd8;
        }

        .tray-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 7px 10px;
            border-radius: 6px;
            color: var(--text-main, #ededed);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.12s ease;
            background: transparent;
            border: none;
            width: 100%;
            text-align: right;
        }

        .tray-item-left {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .tray-item svg {
            color: var(--text-muted, #888888);
            transition: color 0.12s ease;
            flex-shrink: 0;
        }

        .tray-item:hover {
            background: var(--bg-hover, rgba(255, 255, 255, 0.08));
        }

        .tray-item:hover svg {
            color: var(--text-main, #ffffff);
        }

        .tray-item.danger:hover {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
        }

        .tray-item.danger:hover svg {
            color: #ef4444;
        }

        .tray-divider {
            height: 1px;
            background: var(--border, #242424);
            margin: 4px 6px;
        }

        /* Toggle switch styled specifically for tray flyout */
        .tray-switch {
            position: relative;
            display: inline-block;
            width: 34px;
            height: 18px;
            margin: 0;
        }

        .tray-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .tray-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--border, #333333);
            transition: .2s cubic-bezier(0.16, 1, 0.3, 1);
            border-radius: 20px;
        }

        .tray-slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            transition: .2s cubic-bezier(0.16, 1, 0.3, 1);
            border-radius: 50%;
        }

        .tray-switch input:checked + .tray-slider {
            background-color: #0070f3;
        }

        .tray-switch input:checked + .tray-slider:before {
            transform: translateX(16px);
        }
    </style>
</head>
<body>
    <div class="tray-container">
        <div class="tray-card">
            <!-- Header with Title and Toggle Switch (matching Photo 1) -->
            <div class="tray-header">
                <div class="tray-brand">
                    <span class="status-dot"></span>
                    <span>RTL View</span>
                </div>
                <label class="tray-switch" title="فعال/غیرفعال‌سازی وضعیت">
                    <input type="checkbox" id="tray-switch-active" checked>
                    <span class="tray-slider"></span>
                </label>
            </div>

            <!-- Actions list -->
            <button class="tray-item" id="btn-tray-open">
                <div class="tray-item-left">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                    <span>نمایش پنجره (Open)</span>
                </div>
            </button>

            <button class="tray-item" id="btn-tray-settings">
                <div class="tray-item-left">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                    <span>تنظیمات نوار وظیفه (Settings)</span>
                </div>
            </button>

            <button class="tray-item" id="btn-tray-repair">
                <div class="tray-item-left">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
                    <span>تعمیر و بازیابی (Repair)</span>
                </div>
            </button>

            <div class="tray-divider"></div>

            <button class="tray-item danger" id="btn-tray-quit">
                <div class="tray-item-left">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg>
                    <span>خروج از برنامه (Quit)</span>
                </div>
            </button>
        </div>
    </div>
    <script src="tray.js"></script>
</body>
</html>
